name: leadforge  # fixo: o nome do projeto define os volumes (leadforge_pgdata etc.), independe do nome da pasta
services:
  postgres:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: leadforge
      POSTGRES_USER: leadforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  evolution:
    image: evoapicloud/evolution-api:v2.1.1
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://leadforge:${POSTGRES_PASSWORD}@postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=leadforge
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - CACHE_LOCAL_ENABLED=false
      # Webhook POR INSTANCIA (SPEC-011/012): a URL com o token de cada instancia e configurada na criacao/rotacao
      # (/instance/create e /webhook/set). O webhook GLOBAL fica desligado: nao carrega token por instancia.
      - WEBHOOK_GLOBAL_ENABLED=false
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      # Versao do WhatsApp Web usada no pareamento. Sem ela a Evolution v2.1.x recebe statusReason 405 (QR nunca e gerado).
      # Atualize se voltar a falhar: https://raw.githubusercontent.com/wppconnect-team/wa-version/main/versions.json
      - CONFIG_SESSION_PHONE_VERSION=${CONFIG_SESSION_PHONE_VERSION:-2.3000.1047967752}
      - DELAY_MESSAGE=1200
      - DELAY_MESSAGE_TYPING=1000
    volumes:
      - evolution_store:/evolution/store

  n8n:
    image: n8nio/n8n:1.82.1
    depends_on:
      - postgres
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=leadforge
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      # URL do LeadForge vista de DENTRO do container (SPEC-014); sem segredos (o Bearer fica na credencial do n8n).
      - LEADFORGE_URL=${LEADFORGE_URL:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  evolution_store:
  n8n_data:
