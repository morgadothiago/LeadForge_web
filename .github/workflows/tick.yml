name: Tick (agendador)

# A Vercel Hobby so aceita cron 1x/dia (vercel.json). Este workflow chama o tick a cada 5 minutos (minimo do GitHub Actions).
# Segredos do repositorio (Settings > Secrets and variables > Actions): CRON_SECRET (o mesmo da Vercel) e APP_URL
# (ex.: https://app.seudominio.com, sem barra no fim). Sem eles o job avisa e sai sem falhar.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar /api/cron/tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "::warning::CRON_SECRET ou APP_URL nao definidos nos segredos do repositorio; tick nao chamado."
            exit 0
          fi
          code=$(curl -sS -o /tmp/tick.json -w "%{http_code}" --max-time 90 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/cron/tick")
          echo "HTTP ${code}"
          head -c 500 /tmp/tick.json || true
          [ "$code" = "200" ]
